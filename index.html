<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DarkGPT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#0d0d0d;
  border-bottom:1px solid #260909;
}

.logo{
  color:#ff1717;
  font-size:24px;
  font-weight:bold;
}

.status{
  color:#777;
  font-size:12px;
}

#chat{
  height:calc(100vh - 140px);
  overflow-y:auto;
  padding:20px 15px 100px;
}

.message{
  max-width:85%;
  padding:14px 16px;
  margin-bottom:14px;
  border-radius:15px;
  line-height:1.5;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.ai{
  background:#170707;
  border:1px solid #4b1111;
  color:#ff3030;
}

.user{
  background:#191919;
  border:1px solid #292929;
  color:#fff;
  margin-left:auto;
}

.input-area{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:10px;
  background:#080808;
}

.input-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:#111;
  border:1px solid #351010;
  border-radius:18px;
  padding:8px;
}

button{
  border:0;
  cursor:pointer;
}

.attach{
  width:44px;
  height:44px;
  border-radius:13px;
  background:#1b1b1b;
  color:#ff2222;
  font-size:21px;
}

#messageInput{
  flex:1;
  min-width:0;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  font-size:15px;
  padding:12px 5px;
}

#messageInput::placeholder{
  color:#666;
}

.send{
  width:46px;
  height:46px;
  border-radius:13px;
  background:#df0000;
  color:white;
  font-size:20px;
}

#fileInput{
  display:none;
}

#fileName{
  color:#777;
  font-size:11px;
  padding:5px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🔴 DARKGPT</div>
  <div class="status">ONLINE</div>
</header>

<main id="chat">

  <div class="message ai">
Olá! Eu sou a DarkGPT. 🔴

A interface está funcionando.

Digite uma mensagem para testar o chat.
  </div>

</main>

<div class="input-area">

  <div class="input-box">

    <button class="attach"
      onclick="document.getElementById('fileInput').click()">
      📎
    </button>

    <input
      id="fileInput"
      type="file"
      accept="image/*,video/*,.txt,.pdf"
      onchange="selectFile(this)"
    >

    <input
      id="messageInput"
      type="text"
      placeholder="Digite sua mensagem..."
    >

    <button class="send" onclick="sendMessage()">➤</button>

  </div>

  <div id="fileName"></div>

</div>

<script>

const input=document.getElementById("messageInput");
const chat=document.getElementById("chat");

input.addEventListener("keydown",function(e){
  if(e.key==="Enter") sendMessage();
});

function addMessage(text,type){

  const msg=document.createElement("div");

  msg.className="message "+type;

  msg.textContent=text;

  chat.appendChild(msg);

  chat.scrollTop=chat.scrollHeight;
}

function sendMessage(){

  const text=input.value.trim();

  if(!text)return;

  addMessage(text,"user");

  input.value="";

  setTimeout(function(){

    addMessage(
      "Mensagem recebida. A conexão com a inteligência artificial será adicionada na próxima etapa. 🔴",
      "ai"
    );

  },500);
}

function selectFile(input){

  const box=document.getElementById("fileName");

  if(input.files.length){

    box.textContent=
      "Arquivo selecionado: "+input.files[0].name;

  }else{

    box.textContent="";

  }
}

</script>

</body>
      </html>
